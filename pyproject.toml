[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "flywire-bilateral-connectivity"
version = "0.2.0"
description = "Reproducible left-right cell-type wiring comparison for FlyWire connectomes"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/victorsampereira/flywire-bilateral-connectivity"
Issues = "https://github.com/victorsampereira/flywire-bilateral-connectivity/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.14"]
data = ["pyarrow>=15"]
validation = ["duckdb>=1.2", "numpy>=1.24"]

[project.scripts]
flywire-bilateral = "flywire_bilateral.cli:main"

[tool.setuptools.packages.find]
include = ["flywire_bilateral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["flywire_bilateral"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
